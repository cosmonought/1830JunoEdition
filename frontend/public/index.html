<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Design note #1014: the viewport is LOCKED. "Ensure the viewport is locked and strictly prevents user
         scaling" -- so the page may not be pinched or double-tap-zoomed either, not just the board. The canvas
         carries the matching `touch-action: pan-x pan-y`; this is the page-level half of the same instruction.
         `maximum-scale` AND `user-scalable` TOGETHER, deliberately: iOS Safari has ignored `user-scalable=no`
         since iOS 10, and honours `maximum-scale`. Neither alone covers both engines. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Project 18XX -- a tournament-grade on-chain implementation of a classic 18xx railway game, running on the Juno network."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      ROOT BASELINE. Pinned to the browser default rather than left implicit
      or scaled with the viewport.

      Two things this is NOT, both of which were considered and rejected in
      `src/styles/typography.ts`'s own notes and are worth repeating where
      someone editing the HTML will see them:

        - It is not a lever for scaling the app. Every style in this
          codebase is an inline `React.CSSProperties` object in explicit
          `px`, so a root `font-size` does not reach any of them. Tuning
          the app's scale means editing `typography.ts`.

        - It is deliberately not a `vw`/`vh` multiplier. A root size that
          tracks the viewport makes text grow on a wide monitor and shrink
          on a laptop, which is the opposite of what either wants -- a
          bigger screen should show MORE at the same size, not the same
          amount larger.

      What it does do is stop a UA or user default from silently rebasing
      whatever `rem`/`em` values exist now or later, and give `body` an
      explicit, boring starting point.
    -->
    <style>
      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-size: 16px;
        line-height: 1.4;
        /*
          Design note #1100: THE GROUND, PAINTED ONCE.

          REPORTED of the sandbox waiting room: "a bright white background that
          is jarring between the two darks". That screen's root declared layout
          and no `background`, so the page behind its panel was this element --
          and this element had no colour, so it was the user-agent default.

          The lobby and the app shell each set `minHeight: 100vh` and their own
          background, which is why neither ever showed it. That works and it is
          also a thing every future screen has to remember; painting the body is
          the half that does not depend on remembering.

          BOTH ARE DONE. The waiting room now paints its own root as well, so
          the fix does not rest on a rule in a file its author is not reading.
          `#080808` is the theme's deepest ground, so any gap this shows through
          is the colour the app would have put there anyway.
        */
        background-color: #080808;
      }
    </style>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Project 18XX</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
