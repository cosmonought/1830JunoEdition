[package]
name = "eighteen-cosmos"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5.0"
cw-storage-plus = "1.1.0"
schemars = "0.8.15"
serde = { version = "1.0.188", default-features = false, features = ["derive"] }
thiserror = "1.0.49"

[dev-dependencies]
# End-to-end integration harness (`tests/e2e.rs`). Pinned to the 0.20 line
# deliberately: cw-multi-test 1.x and 2.x require cosmwasm-std 2.x, and this
# contract is built against cosmwasm-std 1.5. Bumping this without bumping
# that produces a dependency resolution error, not a subtle failure.
cw-multi-test = "0.20"

[features]
# for more explicit smart contract library compilation
library = []

# ESCROW-2: the settlement escrow contract is a separate crate in this workspace.
# The root package stays the default member, so a bare `cargo build` / `cargo test`
# here still builds and tests only the legacy crate; use `-p eighteen-cosmos-escrow`
# for the escrow contract. The two crates share this Cargo.lock.
[workspace]
members = ["contracts/escrow"]

# Release builds of the escrow contract panic (and so revert the transaction) on
# integer overflow instead of wrapping. Scoped to that package only: the legacy
# crate's release profile is unchanged.
[profile.release.package.eighteen-cosmos-escrow]
overflow-checks = true
