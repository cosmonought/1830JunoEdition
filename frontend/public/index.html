<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="1830: Juno Edition -- a tournament-grade on-chain implementation of the 1830 railroad game, running on the Juno network."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      ROOT BASELINE. Pinned to the browser default rather than left implicit
      or scaled with the viewport.

      Two things this is NOT, both of which were considered and rejected in
      `src/styles/typography.ts`'s own notes and are worth repeating where
      someone editing the HTML will see them:

        - It is not a lever for scaling the app. Every style in this
          codebase is an inline `React.CSSProperties` object in explicit
          `px`, so a root `font-size` does not reach any of them. Tuning
          the app's scale means editing `typography.ts`.

        - It is deliberately not a `vw`/`vh` multiplier. A root size that
          tracks the viewport makes text grow on a wide monitor and shrink
          on a laptop, which is the opposite of what either wants -- a
          bigger screen should show MORE at the same size, not the same
          amount larger.

      What it does do is stop a UA or user default from silently rebasing
      whatever `rem`/`em` values exist now or later, and give `body` an
      explicit, boring starting point.
    -->
    <style>
      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-size: 16px;
        line-height: 1.4;
      }
    </style>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>1830: Juno Edition</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
  </body>
</html>
